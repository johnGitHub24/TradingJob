# Local / demo profile：H2 in-memory，不依賴 PostgreSQL
# 啟動：.\gradlew.bat bootRun --args='--spring.profiles.active=dev'

server:
  port: ${SERVER_PORT:8084}

spring:
  datasource:
    url: jdbc:h2:mem:tradingjob;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console

trading:
  job:
    # demo：縮短 cron 方便觀察（每分鐘）；正式用 application.yml 預設
    stale-order:
      enabled: true
      cron: "0 * * * * *"
    pnl-snapshot:
      enabled: true
      cron: "0 */2 * * * *"
    retry:
      enabled: true
      cron: "0 * * * * *"
    cleanup:
      enabled: true
      cron: "0 */5 * * * *"
startup:
  info:
    h2: true
    probe: true
