server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: trading-job
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/trading}
    username: ${SPRING_DATASOURCE_USERNAME:trading}
    password: ${SPRING_DATASOURCE_PASSWORD:trading}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

trading:
  engine:
    base-url: ${TRADING_ENGINE_BASE_URL:http://localhost:8081}
  job:
    # TaskScheduler：@Scheduled cron 執行緒池（見 SchedulingConfig）
    scheduler:
      pool-size: ${JOB_SCHEDULER_POOL_SIZE:4}
      thread-name-prefix: ${JOB_SCHEDULER_THREAD_PREFIX:trading-job-}
    stale-order:
      enabled: ${JOB_STALE_ORDER_ENABLED:true}
      timeout-seconds: ${JOB_STALE_ORDER_TIMEOUT_SECONDS:300}
      batch-size: 200
      cron: ${JOB_STALE_ORDER_CRON:0 */5 * * * *}
    pnl-snapshot:
      enabled: ${JOB_PNL_SNAPSHOT_ENABLED:true}
      cron: ${JOB_PNL_SNAPSHOT_CRON:0 0 0 * * *}
    retry:
      enabled: ${JOB_RETRY_ENABLED:true}
      max-attempts: 3
      backoff-seconds: 30
      batch-size: 100
      cron: ${JOB_RETRY_CRON:0 * * * * *}
    cleanup:
      enabled: ${JOB_CLEANUP_ENABLED:true}
      event-retention-days: 30
      failed-command-retention-days: 7
      batch-size: 500
      cron: ${JOB_CLEANUP_CRON:0 30 0 * * *}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: trading-job
      instance: ${HOSTNAME:local}

logging:
  level:
    com.trading.job: INFO
