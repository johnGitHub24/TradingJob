spring.application.name=trading-job-test

spring.datasource.url=jdbc:h2:mem:tradingjobtest;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

trading.engine.base-url=http://localhost:8081

trading.job.scheduler.pool-size=4
trading.job.scheduler.thread-name-prefix=trading-job-
trading.job.stale-order.enabled=false
trading.job.stale-order.timeout-seconds=300
trading.job.stale-order.batch-size=200
trading.job.pnl-snapshot.enabled=false
trading.job.retry.enabled=false
trading.job.retry.max-attempts=3
trading.job.retry.backoff-seconds=30
trading.job.retry.batch-size=100
trading.job.cleanup.enabled=false
trading.job.cleanup.event-retention-days=30
trading.job.cleanup.failed-command-retention-days=7
trading.job.cleanup.batch-size=500
